name: PharmaDesk Backend CI & Firebase-First Validation Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend Validation & Firebase-First Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Code quality lint check
        run: npm run lint

      - name: Run Backend Test Suite (Auth, Tenant Isolation, Billing Transactions)
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: pharmadesk-cloud
        run: npm run test:backend

      - name: Build Backend Distribution
        run: npm run build:backend

      - name: Build Frontend Distribution
        run: npm run build:frontend
