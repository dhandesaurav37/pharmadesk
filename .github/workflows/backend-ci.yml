name: PharmaDesk CI — Bun & Firebase-First Validation Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint, Test & Build (Bun + Firebase)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with Bun (preserving bun.lock)
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck (Frontend & Backend)
        run: bun run typecheck

      - name: Code quality lint check
        run: bun run lint

      - name: Run Backend & API Test Suite (Auth, Isolation, RBAC, Inventory, POS, Customers, Suppliers, Accounting & Multi-Branch Transfers)
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: pharmadesk-cloud
        run: bun run test:backend

      - name: Build Backend Distribution (Cloud Run Bundle)
        run: bun run build:backend

      - name: Build Frontend Distribution (Firebase Hosting Bundle)
        run: bun run build:frontend
