services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmadesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pharmadesk
      POSTGRES_USER: pharmadesk_migrator
      POSTGRES_PASSWORD: migrator_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pharmadesk_migrator -d pharmadesk']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
